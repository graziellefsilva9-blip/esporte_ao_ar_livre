<section id="form">
    <h2> Cadastro de Atleta </h2>

    <form action="" id="form-atleta">
        <label for="nome">Nome Completo</label>
        <input type="text" name="nome" id="nome" class="input01"
        maxlength="60" required placeholder="Digite o nome Completo">

        <label for="cpf">CPF</label>
        <input type="text" name="cpf" id="cpf" class="input02"
        maxlength="14" required placeholder="Digite o cpf">

        <label for="sexo">Sexo</label>
        <input type="radio" name="sexo" id="sexoM" class="radio01" required
        value="M"> Masculino
        <input type="radio" name="sexo" id="sexoF" class="radio01" required
        value="F"> Feminino
        <input type="radio" name="sexo" id="sexoN" class="radio01" required
        value="N"> Não Declarar

        <label for="cep">CEP*</label>
        <input type="text" name="cep" id="cep" class="input02"
        maxlength="9" required placeholder="Digite o cep">

        <label for="rua-logradouro">Rua/Logradouro*</label>
        <input type="text" name="rua-logradouro" id="rua-logradouro" class="input02"
        maxlength="100" required placeholder="Digite a Rua ou o Logradouro">

        <label for="bairro">Bairro*</label>
        <input type="text" name="bairro"
        maxlength="60" required placeholder="Digite o bairro">

        <label for="cidade">Cidade*</label>
        <input type="text" name="cidade"
        maxlength="60" required placeholder="Digite a cidade">

       <div id="div-btns">
       <button type="submit" id="btn-cadastrar">Cadastrar</button>
      <button type="reset" id="btn-limpar">Limpar</button>
      </div>

</form>
</section>
