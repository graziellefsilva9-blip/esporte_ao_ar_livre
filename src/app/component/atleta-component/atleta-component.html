<section id="form">
    <h2>Cadastro de Atleta</h2>
  
    <form id="form-atleta" (ngSubmit)="enviarDadosAtleta()">
  
      <label for="nome">Nome Completo</label>
      <input type="text" name="nome" id="nome" [(ngModel)]="nome" maxlength="60" required laceholder="Digite o nome completo">
  
      <label for="cpf">CPF</label>
      <input type="text"
        name="cpf"
        id="cpf"
        [(ngModel)]="cpf"
        maxlength="14"
        required
        placeholder="Digite o CPF">
  
      <label>Sexo</label>
  
      <input
        type="radio"
        name="sexo"
        [(ngModel)]="sexo"
        value="M">
      Masculino
  
      <input
        type="radio"
        name="sexo"
        [(ngModel)]="sexo"
        value="F">
      Feminino
  
      <input
        type="radio"
        name="sexo"
        [(ngModel)]="sexo"
        value="N">
      Não Declarar
  
      <label for="cep">CEP</label>
      <input
        type="text"
        name="cep"
        id="cep"
        [(ngModel)]="cep"
        maxlength="9"
        required
        placeholder="Digite o CEP">
  
      <label for="ruaLogradouro">Rua/Logradouro</label>
      <input
        type="text"
        name="ruaLogradouro"
        id="ruaLogradouro"
        [(ngModel)]="ruaLogradouro"
        maxlength="100"
        required
        placeholder="Digite a rua ou logradouro">
  
      <label for="bairro">Bairro</label>
      <input
        type="text"
        name="bairro"
        id="bairro"
        [(ngModel)]="bairro"
        maxlength="60"
        required
        placeholder="Digite o bairro">
  
      <label for="cidade">Cidade</label>
      <input
        type="text"
        name="cidade"
        id="cidade"
        [(ngModel)]="cidade"
        maxlength="60"
        required
        placeholder="Digite a cidade">
  
      <label for="uf">UF</label>
      <input
        type="text"
        name="uf"
        id="uf"
        [(ngModel)]="uf"
        maxlength="2"
        required
        placeholder="Digite a UF">
  
        <div id="div-btns">
          <button type="submit" id="btn-cadastrar">
            Cadastrar
          </button>
    
          <button type="button" id="btn-limpar" (click)="limparDados()">
            Limpar
          </button>
        </div>
  
    </form>
  </section>
