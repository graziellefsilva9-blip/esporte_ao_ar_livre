<div class="container">

    <div class="card">
  
      <h2>Cadastro de Corrida</h2>
  
      <hr>
  
      <form (ngSubmit)="cadastrar()">
  
        <div class="campo">
          <label for="descricao">Descrição da Corrida</label>
  
          <textarea
            id="descricao"
            name="descricao"
            [(ngModel)]="descricao"
            placeholder="Ex: 5ª Maratona Noturna da Cidade">
          </textarea>
        </div>
  
        <div class="campo">
          <label for="data">Data da Corrida</label>
  
          <input
            type="date"
            id="data"
            name="data"
            [(ngModel)]="data">
        </div>
  
        <div class="campo">
          <label>Distâncias Disponíveis</label>
  
          <div class="distancias">
  
            <label class="check">
              <input
                type="checkbox"
                name="distancia5km"
                [(ngModel)]="distancia5km">
              5km
            </label>
  
            <label class="check">
              <input
                type="checkbox"
                name="distancia10km"
                [(ngModel)]="distancia10km">
              10km
            </label>
  
            <label class="check">
              <input
                type="checkbox"
                name="distancia25km"
                [(ngModel)]="distancia25km">
              25km
            </label>
  
          </div>
        </div>
  
        <button type="submit">
          Cadastrar Corrida
        </button>
  
      </form>
  
    </div>
  
  </div>
